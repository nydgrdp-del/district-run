name: Build District Run APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_city_textures.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35"'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: district-jewelry-debug-keystore-v1
      - shell: bash
        run: |
          mkdir -p ~/.config/godot ~/.android artifacts
          test -f ~/.android/debug.keystore || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug" -keyalg RSA -validity 10000
          cat > ~/.config/godot/editor_settings-4.6.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          SETTINGS
          sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' client/project.godot
          sdk_templates="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          test -s "$sdk_templates/android_debug.apk"
          sed -i "s|custom_template/debug=\"\"|custom_template/debug=\"$sdk_templates/android_debug.apk\"|;s|custom_template/release=\"\"|custom_template/release=\"$sdk_templates/android_release.apk\"|" client/export_presets.cfg
          godot --headless --path client --editor --import
          godot --headless --path client --export-debug Android ../artifacts/District-Run.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify artifacts/District-Run.apk
      - uses: actions/upload-artifact@v4
        with:
          name: District-Run-Android
          path: artifacts/District-Run.apk
