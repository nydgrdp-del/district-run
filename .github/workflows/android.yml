name: Build District Run APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - shell: bash
        run: |
          mkdir -p ~/.config/godot ~/.android artifacts
          test -f ~/.android/debug.keystore || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug" -keyalg RSA -validity 10000
          cat > ~/.config/godot/editor_settings-4.6.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          SETTINGS
          godot --headless --path client --editor --import
          godot --headless --path client --export-debug Android ../artifacts/District-Run.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify artifacts/District-Run.apk
      - uses: actions/upload-artifact@v4
        with:
          name: District-Run-Android
          path: artifacts/District-Run.apk
